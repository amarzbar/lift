services:
  lift:
    # Published by .github/workflows/docker.yml on every push to main.
    # `build: .` stays as a fallback so `docker compose up -d --build` still
    # builds locally from the checkout.
    image: ghcr.io/amarzbar/lift:latest
    build: .
    container_name: lift
    restart: unless-stopped
    user: "1000:1000"          # malamar user, so ./data stays owned by you
    ports:
      - "127.0.0.1:3017:3000"   # only reachable via `tailscale serve` (HTTPS on :4443)
    volumes:
      - ./data:/data
    environment:
      - TZ=America/Toronto
      - AUTH_MODE=single        # 'multi' = require username/password login
      - DEFAULT_USER=me
      # - DEFAULT_PASSWORD=...  # set to allow logging in as the default user in multi mode
      - VAPID_SUBJECT=https://malamar.chimera-alioth.ts.net:4443
